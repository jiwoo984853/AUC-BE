name: CD - Build and Push Docker Image
on:
  push:
    branches: [ main ]
jobs:
  springboot-auction-cd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
      
      - name: Build with Gradle
        run: ./gradlew build -x test
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/springboot-auction:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
  deploy:
    needs: springboot-auction-cd
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy springboot-auction via SSM" \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --parameters 'commands=[
            "cd /home/ec2-user/app",
            "docker-compose pull",
            "docker-compose down",
            "docker-compose up -d"
          ]' \
          --region "${{ secrets.AWS_REGION }}"

