<!DOCTYPE html>
<html>
<head>
    <title>채팅 테스트</title>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: Arial; padding: 20px; }
        #messages {
            border: 1px solid #ccc;
            height: 300px;
            overflow-y: scroll;
            padding: 10px;
            margin: 10px 0;
        }
        .message {
            padding: 5px;
            margin: 5px 0;
            border-radius: 5px;
        }
        .my-message {
            background-color: #dcf8c6;
            text-align: right;
        }
        .other-message {
            background-color: #f0f0f0;
        }
        input[type="text"] {
            width: 70%;
            padding: 10px;
        }
        button {
            padding: 10px 20px;
        }
    </style>
</head>
<body>
<h1>채팅 테스트</h1>

<div>
    <label>채팅방 ID: <input type="number" id="roomId" value="1"></label>
    <label>사용자 ID: <input type="number" id="userId" value="2"></label>
    <button onclick="connect()">연결</button>
    <button onclick="disconnect()">연결 끊기</button>
</div>

<div id="messages"></div>

<div>
    <input type="text" id="messageInput" placeholder="메시지 입력..."
           onkeypress="if(event.keyCode==13) sendMessage()">
    <button onclick="sendMessage()">전송</button>
</div>

<script>
    let stompClient = null;
    let roomId = null;
    let userId = null;

    function connect() {
        roomId = document.getElementById('roomId').value;
        userId = document.getElementById('userId').value;

        const socket = new SockJS('http://localhost:8080/ws-chat');
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            console.log('Connected: ' + frame);

            // 채팅방 구독
            stompClient.subscribe('/topic/chat/rooms/' + roomId, function(message) {
                showMessage(JSON.parse(message.body));
            });

            addSystemMessage('채팅방에 연결되었습니다.');
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        addSystemMessage('연결이 끊어졌습니다.');
    }

    function sendMessage() {
        const messageInput = document.getElementById('messageInput');
        const content = messageInput.value.trim();

        if (content && stompClient) {
            const chatMessage = {
                senderId: userId,
                messageContent: content
            };

            stompClient.send(
                '/app/chat/rooms/' + roomId + '/send',
                {},
                JSON.stringify(chatMessage)
            );

            messageInput.value = '';
        }
    }

    function showMessage(message) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message ' +
            (message.senderId == userId ? 'my-message' : 'other-message');

        messageDiv.innerHTML = `
                <strong>${message.senderName}</strong>
                (${new Date(message.createdAt).toLocaleTimeString()})<br>
                ${message.messageContent}
            `;

        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function addSystemMessage(text) {
        const messagesDiv = document.getElementById('messages');
        const messageDiv = document.createElement('div');
        messageDiv.style.color = '#666';
        messageDiv.style.fontStyle = 'italic';
        messageDiv.textContent = text;
        messagesDiv.appendChild(messageDiv);
    }
</script>
</body>
</html>
